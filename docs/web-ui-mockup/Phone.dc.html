<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forkdeck — Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0F1115}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #E6E8EC; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #2A2F3A; background: #12151B">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2A541" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="12" r="2"></circle><path d="M6 7v10M6 12h4a4 4 0 0 0 4-4V7M14 12h2"></path></svg>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">forkdeck</span>
<div style="flex: 1 1 auto"></div>
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA3B2"><span style="width: 8px; height: 8px; border-radius: 4px; background: #4FD1C5"></span>Live</span>
</header>
<div role="tablist" style="display: flex; gap: 6px; padding: 10px 12px; overflow-x: auto; border-bottom: 1px solid #22262F">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" role="tab" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<div style="flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{jobs}}" as="job" hint-placeholder-count="5">
<button type="button" style="all: unset; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 10px; background: #171A21; border: 1px solid #2A2F3A; cursor: pointer; min-height: 44px">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #9AA3B2"><span>#{{job.id}}</span><span style="{{job.pillStyle}}">{{job.state}}</span><span style="margin-left: auto">{{job.lane}}</span></div>
<div style="font-size: 14px; line-height: 1.35; font-weight: 500">{{job.title}}</div>
<div style="font-size: 12px; color: #9AA3B2">{{job.meta}}</div>
</button>
</sc-for>
</div>
<form style="display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2A2F3A; background: #12151B">
<label for="ptask" style="position: absolute; width: 1px; height: 1px; overflow: hidden">New task</label>
<input id="ptask" placeholder="New task…" style="flex: 1 1 auto; min-width: 0; background: #0F1115; color: #E6E8EC; border: 1px solid #2A2F3A; border-radius: 8px; padding: 10px 12px; font: inherit; min-height: 44px; box-sizing: border-box">
<button type="button" style="background: #F2A541; color: #141413; border: none; border-radius: 8px; padding: 0 16px; font: inherit; font-weight: 600; min-height: 44px; cursor: pointer">Start</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'Active' };
  }
  renderVals() {
    var self = this;
    var TONE = { waiting: ['#2A2F3A','#C9CFDA'], working: ['#123331','#7FE3D8'], reviewing: ['#1B2640','#A9C1FF'], 'PR open': ['#1B2640','#A9C1FF'], done: ['#1C2A1C','#A8E0A0'], unverified: ['#3A2A12','#FFC67A'], failed: ['#3A1A18','#FF9A8A'] };
    var J = [
      { id: 72, state: 'working', lane: 'Build', title: 'semantic-context#22 Home record API', meta: 'claude · standard · 6m', group: 'Active' },
      { id: 73, state: 'reviewing', lane: 'Review', title: 'Forkdeck: unverified work never reads as done', meta: 'codex review · round 1', group: 'Active' },
      { id: 60, state: 'PR open', lane: 'Delivery', title: 'semantic-context#21 Persisted home records', meta: 'PR !71 · CI running', group: 'Active' },
      { id: 74, state: 'waiting', lane: 'Queue', title: 'semantic-context#24 Home sync worker', meta: 'blocked by #23 · not merged', group: 'Active' },
      { id: 62, state: 'unverified', lane: 'Attention', title: 'Plans render a readable task list (first try)', meta: 'nothing built or tested', group: 'Attention' },
      { id: 61, state: 'failed', lane: 'Attention', title: 'A plan can carry a validated task list', meta: 'fix changed nothing', group: 'Attention' },
      { id: 70, state: 'done', lane: 'Done', title: 'Fix four ways a task could start early', meta: 'committed 2803c77', group: 'Done' }
    ];
    var f = this.state.filter;
    var filters = ['Active', 'Attention', 'Done', 'All'].map(function (n) {
      var on = n === f;
      return { label: n, pick: function () { self.setState({ filter: n }); }, style: 'flex: 0 0 auto; background: ' + (on ? '#1E222B' : 'transparent') + '; color: ' + (on ? '#E6E8EC' : '#9AA3B2') + '; border: 1px solid ' + (on ? '#2A2F3A' : 'transparent') + '; border-radius: 18px; padding: 0 14px; min-height: 36px; font: inherit; font-size: 13px; cursor: pointer' };
    });
    var jobs = J.filter(function (j) { return f === 'All' || j.group === f; }).map(function (j) {
      var t = TONE[j.state];
      return Object.assign({}, j, { pillStyle: 'padding: 2px 8px; border-radius: 10px; font-size: 11px; background: ' + t[0] + '; color: ' + t[1] });
    });
    return { filters: filters, jobs: jobs };
  }
}
</script>
</body>
</html>
