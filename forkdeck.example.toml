# forkdeck configuration.
# Read from ~/.config/forkdeck/config.toml, or the file given with --config.
# It is never read from the working directory: agents edit files there, and this
# file names commands to run.
#
# Every key is optional and what you leave out keeps its default. As written,
# this file behaves the same as having no config. Lines starting with "#~" are
# examples to uncomment.

[router]
# "auto":  ask a Jev-compatible decision server at router.jev.base_url when one answers
#          (scripts/local-jev.sh starts one on this machine), the keyword rules otherwise.
# "rules": keyword rules, no network.
# "jev":   always ask the decision server; say so when falling back to the rules.
kind = "auto"
default_agent = "claude"
# Answers under this confidence count as "split" and take the cautious branch:
# the default agent, the next effort tier up, and a review. Between 0.5 and 1.
threshold = 0.6
# With a decision server: "auto" lets it ask for a plan first on open-ended tasks,
# so you choose an approach before work starts; "never" does not ask. Ctrl-P and
# `forkdeck run --plan` plan either way.
plan = "auto"

[router.jev]
# A local server such as jeff listens here by default. Any server that speaks the
# same wire format works, including the hosted one.
base_url = "http://127.0.0.1:8000"
model = "jev-latest"
# Name of the environment variable that holds the bearer key. Leave the variable
# unset when the local server runs without auth.
api_key_env = "FORKDECK_JEV_KEY"
timeout_ms = 4000
# These two descriptions are what the decision model picks between. Tune them to
# how you actually want work divided.
claude_is_for = "Open-ended or ambiguous work: multi-file refactors, design changes, documentation"
codex_is_for = "Well-specified work: a bug with a clear reproduction, a contained feature, tests, scripts"

[router.rules]
# Used when no decision server answers. The built-in lists cover common phrasings;
# a list set here replaces the built-in one. Keywords may be phrases, and word
# forms match ("fix" also matches "fixes", "fixed" and "fixing").
#~ claude_keywords = ["refactor", "clean up", "document", "explain", "design"]
#~ codex_keywords = ["bug", "fix", "failing", "stack trace", "implement"]
#~ heavy_keywords = ["migration", "race condition", "security", "rewrite"]
#~ light_keywords = ["typo", "rename", "one line", "version bump"]
# Typed tasks with these phrases propose approaches first (router.plan = "never" turns it off).
#~ plan_keywords = ["how should", "which approach", "pros and cons"]

[router.memory]
# Route a task like earlier ones that went well the way they were, without asking.
enabled = true
similarity = 0.8       # shared words over all words, 0 to 1
min_matches = 2        # earlier tasks that went well before memory answers
step_down = true       # then try a tier lower to use fewer tokens...
step_down_after = 3    # ...once this many went well at a tier

[agents]
timeout_mins = 45
# Without your own plugins, hooks and MCP servers (the repository's settings still apply):
# they add thousands of tokens to every call an agent makes. false loads them.
lean = true
# Claude workers run any build or test command inside Claude Code's sandbox (needs bubblewrap
# and socat on Linux). Unset: whenever those are installed. false: only the build commands
# found for each repository, by name.
#~ sandbox = true

# Hosts a sandboxed worker's commands may reach. The public package registries of the
# languages a repository uses are open by default, and so are the mirrors your package managers
# already use (found in your own .npmrc, pip.conf, settings.xml, GOPROXY, ...). List any others
# here; public_registries = false leaves only the mirrors.
[agents.network]
public_registries = true
detect_mirrors = true
#~ mirrors = ["nexus.example.com", "artifactory.example.com"]

[agents.claude]
cmd = "claude"
models = { light = "haiku", standard = "sonnet", heavy = "opus" }
efforts = { light = "low", standard = "medium", heavy = "high" }
# acceptEdits lets the agent edit files. A worker may also run the project's own build and
# test commands (cargo, go, gradle, mvn, npm, pytest, make, dotnet, ... as its build files show)
# and read-only git, so it can work test first; any other command is refused.
# Loosen this only for repositories and issue authors you trust.
write_args = ["--permission-mode", "acceptEdits"]
review_args = ["--permission-mode", "plan"]

[agents.codex]
cmd = "codex"
# Empty model names keep the codex CLI's own default.
models = { light = "", standard = "", heavy = "" }
efforts = { light = "low", standard = "medium", heavy = "high" }
write_args = ["--sandbox", "workspace-write"]
review_args = ["--sandbox", "read-only"]

[agents.copilot]
cmd = "copilot"
# Empty model names keep the copilot CLI's own default; "auto" lets Copilot pick.
models = { light = "", standard = "", heavy = "" }
efforts = { light = "low", standard = "medium", heavy = "high" }
# Edit files, no shell commands unattended. Never use --allow-all or --yolo here.
write_args = ["--allow-tool", "write", "--deny-tool", "shell"]
review_args = ["--deny-tool", "write", "--deny-tool", "shell", "--excluded-tools", "skill"]
# With claude or codex missing, copilot plays that part with a Claude or GPT model,
# so work and review still come from different vendors.
stand_in = true

# Models per tier, in order of preference: the first one your account allows is
# used. Organisations switch models on and off; forkdeck asks copilot which are
# enabled and skips the others.
#~ [agents.copilot.profiles.claude.models]
#~ standard = ["claude-sonnet-5.5", "claude-sonnet-4.5"]

# Any other model your copilot /model picker lists can be a profile, named
# "copilot:<name>" in reviewer_order, pr_reviewers or --agent.
#~ [agents.copilot.profiles.second]
#~ vendor = "xai"
#~ models = { light = "grok-4.7", standard = "grok-4.7", heavy = "grok-4.7" }

[review]
mode = "auto"          # auto | always | never
reviewer = "other"     # other: the CLI that did not do the work | same
# With reviewer = "other": the first of these that is available and runs a model
# from a different vendor than the worker's reviews.
reviewer_order = ["claude", "codex"]
# Fix rounds after a failed review or failed checks. The worker addresses each
# failure until the review passes; this only caps runaway loops. It also stops
# early when a fix changes nothing.
max_fix_rounds = 5
# Commands run after the worker finishes a task typed into the prompt. A failing
# command goes back to the worker as a fix round. Repositories list their own below.
checks = []
check_timeout_mins = 20
# Every agent listed here reviews a labelled pull request independently;
# "copilot:<profile>" works too.
pr_reviewers = ["claude", "codex"]
# A pull request review that produced no result (a reviewer did not finish, the
# head moved while it was being reviewed, the review could not run) is retried
# this many times, waiting retry_secs before the first retry and three times
# longer before each later one. After that, remove and re-apply the label.
max_retries = 3
retry_secs = 120

[automation]
enabled = false        # toggle at runtime with Ctrl-A
max_parallel = 2
poll_secs = 60
draft = true
publish_on_failed_review = false
# worktree_root = "~/.cache/forkdeck/worktrees"

# How much of this machine forkdeck may take. Checks build and test; several at once starve
# the machine and fail timing-sensitive tests. A job waiting for a build lends its agent slot
# to other jobs meanwhile.
[resources]
builds = 1           # checks running at the same time
nice = 10            # niceness of agents and what they start, 0..19; 0 leaves it alone
check_nice = 0       # niceness of checks: the check decides the job, so it gets the CPU first
check_retries = 1    # a failed check runs again once the machine is quiet; a later pass is flaky
build_cache = true   # share build output and toolchain caches between worktrees (Cargo, Go, Gradle, Maven,
                     # sbt, .NET, Swift, Stack/Cabal, dune, Zig, dub, Nim, Mix, rebar3, pub, Bazel, npm, pip;
                     # ccache/sccache when installed) and let Codex's sandbox write to them
max_load = 1.0       # hold a check back while load > this x CPUs (at most 10 min); 0: off

# How much forkdeck may pick up by itself. Counted over the last 24 hours from its
# journal (~/.local/state/forkdeck/journal.jsonl), so a restart resets nothing.
# 0 switches a limit off. What a limit holds back stays labelled and untouched.
[limits]
jobs_per_day = 0           # issues and reviews picked up, all repositories together
tokens_per_day = 0         # tokens in and out, both CLIs, typed tasks included
job_mins = 0               # one issue or review may run this long, then goes to a person
pause_after_failures = 5   # this many failed in a row on a repository: stop picking up from it
pause_mins = 60            # ...for this long

# Notes about each repository, given to the worker with every issue: the team's,
# from .forkdeck/notes.md on the base branch, and this machine's own, kept in
# ~/.local/state/forkdeck/notes/. `forkdeck notes` shows both.
[knowledge]
enabled = true
# After work was sent back or a review asked for changes, have a CLI distil up to
# three general rules from the findings. Off by default.
learn = false
# true: propose learned rules as a pull request against .forkdeck/notes.md, so a
# person approves what every teammate's jobs will read. false: write them to
# this machine's own notes, where they take effect at once for this machine only.
share = true
max_learned = 30           # learned rules kept per repository; the oldest make room
max_chars = 6000           # how much of the notes goes into a prompt
brief_chars = 30000        # repository brief in front of an issue: layout, manifests, the files it names; 0: off

# Sharing with teammates who run forkdeck on the same repositories. The shared
# state is comments on GitHub or GitLab; only metadata goes into them (who, which
# machine, agent, stage, times, the pull request link). Typed tasks are never shared.
[team]
enabled = false        # claim with a status comment, and leave alone what a teammate holds
stale_mins = 30        # a claim not refreshed for this long stops blocking others
heartbeat_secs = 300   # how often a running job refreshes its comment
refresh_secs = 120     # how often the team pane (Ctrl-T) re-reads the forge
assign = true          # assign a claimed issue to the logged-in account
deploys = true         # announce deployments on the commit (GitHub only)
# Machine name shown to teammates. Default: the hostname on private repositories,
# nothing on public ones. A name set here is posted everywhere; "" posts none.
# host = "build-02"

# Control from a phone on the same network (the forkdeck Android app), over mutual TLS.
# Pair a phone with `forkdeck remote pair` while forkdeck is running: it shows a QR code
# that works once, for two minutes, and only from the same subnet as this machine.
# A paired phone can start tasks that agents carry out in `workdir`; remove one with
# `forkdeck remote revoke <name>`.
[remote]
enabled = false
listen = "0.0.0.0:7443"
lan_only = true        # refuse connections from outside this machine's subnets, not only pairing
dir = "~/.config/forkdeck/remote"   # certificate authority, paired devices
# workdir = "~/src/project"         # where tasks from the phone run; default: where forkdeck started

# A repository can instead keep the keys below (except provider, repo, path and base) in its own
# .forkdeck/config.toml, read from the base branch. Started inside such a clone, forkdeck adds it
# without an entry here. For a repository listed here too, what you set here wins.
#~ [[repos]]
#~ provider = "github"    # uses the gh CLI and its login
#~ repo = "your-name/your-project"
#~ path = "~/src/your-project"
#~ base = "main"
#~ label = "agent:ready"
#~ working_label = "agent:working"
#~ jobs_per_day = 0        # limit for this repository alone; 0 leaves it to [limits]
#~ done_label = "agent:pr-open"
#~ failed_label = "agent:needs-human"
#~ plan_label = "forkdeck:plan"     # marks the parent issue of a plan split into sub-issues
#~ human_label = "needs-human"      # put on a task that needs a person before it can go on
#~ # Only these accounts' issues and pull requests are picked up. Set this on public repositories.
#~ allowed_authors = ["your-name"]
#~ # Run in the issue's worktree before any review. These run as you, on code an agent just wrote.
#~ checks = ["cargo test --quiet"]
#~ # Hosts a sandboxed worker's commands may reach (a package registry, say). None by default.
#~ agent_domains = ["crates.io", "static.crates.io"]
#~ # Pull requests with this label are reviewed and commented on, never approved or merged.
#~ pr_label = "review:ready"
#~ pr_working_label = "review:running"
#~ pr_pass_label = "review:passed"
#~ pr_fail_label = "review:changes"
#~ # Also run `checks` on labelled pull requests. This executes the pull request's code on your
#~ # machine, so leave it off unless every author who can get the label applied is trusted.
#~ pr_checks = false

#~ # Watch the project's CI on the pull requests forkdeck opens. A failure goes back to the worker
#~ # with the log, and the fix is pushed as a further commit, max_fix_rounds times.
#~ [repos.ci]
#~ server = "github"
#~ interval_secs = 30
#~ timeout_mins = 30
#~ max_fix_rounds = 1
#~ # Only for a status that is asked by {sha} and has no revision pattern: a failure seen this soon,
#~ # before the pipeline was seen running, is not believed yet.
#~ settle_secs = 60
#~ [repos.ci.status]
#~ tool = "pull_request_read"
#~ args = { owner = "{owner}", repo = "{name}", pullNumber = "{pr}", method = "get_check_runs" }
#~ # Tried in the order failure, pending, success. An answer that matches none is pending,
#~ # and a tool error is retried, never read as a failure.
#~ failure = '"conclusion":\s*"(failure|timed_out|cancelled|action_required)"'
#~ pending = '"status":\s*"(queued|in_progress|pending|waiting|requested)"'
#~ success = '"conclusion":\s*"success"'
#~ # Required, unless args pass {sha} so the tool is asked about the exact commit: where the answer
#~ # names the commit it is about. Only answers about the commit forkdeck pushed are believed, so a
#~ # result left over from the previous push, pass or fail, is never taken for the new one.
#~ revision = '"head_sha":\s*"([0-9a-f]{40})"'
#~ # Taken from the failing answer for the log call below.
#~ capture = { run_id = '/actions/runs/(\d+)', job_id = '/job/(\d+)' }
#~ [repos.ci.logs]
#~ tool = "get_job_logs"
#~ args = { owner = "{owner}", repo = "{name}", run_id = "{run_id}", job_id = "{job_id}", failed_only = true, return_content = true, tail_lines = 200 }

#~ # When the base branch moves, deploy that commit to staging, check it, and roll back if there is
#~ # evidence it is bad. An environment whose name contains "prod" does not load; that checks the
#~ # name only, so do not point this at production.
#~ #
#~ # This Argo CD stage is a starting point, not a tested recipe: check the argument names with
#~ # `forkdeck mcp tools argocd` and every pattern against `forkdeck mcp call argocd get_application ...`.
#~ [repos.deploy]
#~ server = "argocd"
#~ environment = "staging"
#~ interval_secs = 15
#~ timeout_mins = 15            # raise this for a staged rollout
#~ pause_timeout_mins = 1440    # how long it may wait for a manual promotion
#~ # Commands run once the deployment is healthy. A failure triggers the rollback.
#~ verify = ["curl -fsS https://staging.example.com/healthz"]
#~ # Leave the trigger out when merging already deploys (auto-sync).
#~ [repos.deploy.trigger]
#~ tool = "sync_application"
#~ args = { applicationName = "your-app-staging" }
#~ [repos.deploy.status]
#~ tool = "get_application"
#~ args = { applicationName = "your-app-staging" }
#~ failure = '"status":\s*"(Degraded|Missing)"|"phase":\s*"(Failed|Error)"'
#~ pending = '"status":\s*"(Progressing|OutOfSync)"|"phase":\s*"Running"'
#~ success = '"status":\s*"Healthy"'
#~ # For a canary, percentage or region-by-region rollout. The strategy is the deployment system's;
#~ # these only let forkdeck follow it. All three are optional.
#~ # paused = '"phase":\s*"Paused"'          # waiting for a person; not charged to timeout_mins
#~ # reverted = '"phase":\s*"(Aborted)"'     # the system restored the old version itself: no rollback call
#~ # progress = '"message":\s*"([^"]+)"'     # first group is shown while waiting
#~ # Required. First group: the commit the answer is about. Until it is the commit being deployed, the answer is pending.
#~ revision = '"revision":\s*"([0-9a-f]{7,40})"'
#~ # {last_good} is the last commit that deployed and verified cleanly.
#~ [repos.deploy.rollback]
#~ tool = "sync_application"
#~ args = { applicationName = "your-app-staging", revision = "{last_good}" }
#~ # Any tool on any server; {message} is a one-line result.
#~ # [repos.deploy.notify]
#~ # server = "chat"
#~ # tool = "post_message"
#~ # args = { channel = "deploys", text = "{message}" }

#~ [[repos]]
#~ provider = "gitlab"    # uses the glab CLI and its login
#~ repo = "your-group/your-project"
#~ path = "~/src/your-gitlab-project"
#~ base = "main"

# MCP servers the CI and deploy stages call. Any server works: forkdeck only needs the name of a
# tool, its arguments and how to read the answer. List what a server offers with
#     forkdeck mcp tools <name>
# and try a call with
#     forkdeck mcp call <name> <tool> '{"json":"arguments"}'
# ${NAME} is replaced from the environment, so tokens stay out of this file.

#~ [mcp.github]
#~ command = "docker"
#~ args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "ghcr.io/github/github-mcp-server"]
#~ env = { GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}" }

#~ [mcp.argocd]
#~ command = "npx"
#~ args = ["argocd-mcp@latest", "stdio"]
#~ env = { ARGOCD_BASE_URL = "https://argocd.example.com", ARGOCD_API_TOKEN = "${ARGOCD_TOKEN}" }

# A server reached over HTTP instead of started as a command:
# [mcp.pipelines]
# url = "http://127.0.0.1:3000/mcp"
# headers = { Authorization = "Bearer ${PIPELINES_TOKEN}" }
# timeout_secs = 60

# Optional worker-model trials: disabled unless explicitly configured.
# See docs/adaptive-routing.md for evidence generation and all required gates.
[adaptive]
mode = "off"

# Optional adaptive extensions (inside [adaptive]):
# objective = "reported_cost_usd" # default: tokens; requires complete reported USD costs
# invocation_max_usd = 1.0       # installed Claude flag when supported; not a token cap
# cohorts = [{ definition = "prompt-proxy-v1", category = "fix", complexity = "standard", context = "prompt-small" }]
